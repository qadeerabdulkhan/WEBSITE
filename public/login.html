<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in — ZAQA</title>
  <meta name="description" content="Sign in or create your ZAQA account.">
  <meta name="theme-color" content="#0a0908">
  <link rel="icon" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&family=Pinyon+Script&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="grain">
  <div class="auth-page">
    <div class="auth-visual">
      <canvas id="stage" class="stage-abs" aria-hidden="true"></canvas>
      <div class="caption">
        <p class="eyebrow">Fragrances by Zaqa</p>
        <h1>Enter the world of <em class="gold-text">ZAQA</em></h1>
        <p>Sign in to explore the collection, track your orders and check out securely.</p>
      </div>
    </div>
    <main class="auth-panel">
      <div id="auth-logo"></div>
      <h2 id="auth-title">Welcome back</h2>
      <p class="muted" id="auth-sub">Sign in with your email or mobile number.</p>
      <div class="auth-tabs" role="tablist">
        <button role="tab" id="tab-login" aria-selected="true">Sign in</button>
        <button role="tab" id="tab-register" aria-selected="false">Create account</button>
      </div>
      <form class="auth-form" id="auth-form" novalidate>
        <div class="field" id="name-field" hidden><label for="name">Full name</label><input class="input" id="name" autocomplete="name"></div>
        <div class="id-switch" role="group" aria-label="Sign in with">
          <button type="button" data-id="email" aria-pressed="true">Email</button>
          <button type="button" data-id="phone" aria-pressed="false">Mobile number</button>
        </div>
        <div class="field"><label for="identifier" id="identifier-label">Email address</label>
          <input class="input" id="identifier" type="email" autocomplete="username" placeholder="you@example.com" required></div>
        <div class="field"><label for="password">Password</label>
          <div class="pw-wrap"><input class="input" id="password" type="password" autocomplete="current-password" minlength="8" required>
          <button type="button" id="pw-toggle">Show</button></div></div>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button class="btn btn-block" id="auth-submit" type="submit">Sign in</button>
      </form>
    </main>
  </div>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
