<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My account — ZAQA</title>
  <meta name="description" content="Your ZAQA orders and profile.">
  <meta name="theme-color" content="#0a0908">
  <link rel="icon" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&family=Pinyon+Script&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="grain">
  <main class="page-content">
    <section class="page-banner" style="height:clamp(260px,38vh,380px)">
      <canvas id="stage" class="stage-abs" aria-hidden="true"></canvas>
      <div class="container">
        <p class="eyebrow">My account</p>
        <h1 id="greeting">Welcome</h1>
      </div>
    </section>
    <div class="container account-layout">
      <nav class="account-nav" aria-label="Account sections">
        <button data-tab="orders" aria-current="true">My orders</button>
        <button data-tab="profile">Profile</button>
        <button data-tab="address">Address book</button>
        <button data-tab="security">Password</button>
        <button data-tab="logout">Sign out</button>
      </nav>
      <div id="panel"></div>
    </div>
  </main>
  <script type="module" src="/js/pages/account.js"></script>
</body>
</html>
