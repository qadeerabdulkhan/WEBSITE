<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Checkout — ZAQA</title>
  <meta name="description" content="Secure checkout.">
  <meta name="theme-color" content="#0a0908">
  <link rel="icon" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&family=Pinyon+Script&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container plain-page">
    <h1>Checkout</h1>
    <form id="checkout" class="two-col" novalidate>
      <div>
        <section class="card">
          <h2>Delivery details</h2>
          <div class="form-grid">
            <div class="field full"><label for="fullName">Full name</label><input class="input" id="fullName" name="fullName" autocomplete="name" required></div>
            <div class="field"><label for="phone">Mobile number</label><input class="input" id="phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="03xx xxxxxxx" required></div>
            <div class="field"><label for="email">Email (for receipt)</label><input class="input" id="email" name="email" type="email" autocomplete="email"></div>
            <div class="field full"><label for="line1">Address</label><input class="input" id="line1" name="line1" autocomplete="address-line1" placeholder="House, street, area" required></div>
            <div class="field full"><label for="line2">Apartment, landmark (optional)</label><input class="input" id="line2" name="line2" autocomplete="address-line2"></div>
            <div class="field"><label for="city">City</label><input class="input" id="city" name="city" autocomplete="address-level2" required></div>
            <div class="field"><label for="province">Province</label>
              <select class="input" id="province" name="province" autocomplete="address-level1">
                <option>Punjab</option><option>Sindh</option><option>Khyber Pakhtunkhwa</option><option>Balochistan</option>
                <option>Islamabad Capital Territory</option><option>Gilgit-Baltistan</option><option>Azad Jammu &amp; Kashmir</option>
              </select></div>
            <div class="field"><label for="postalCode">Postal code</label><input class="input" id="postalCode" name="postalCode" autocomplete="postal-code" inputmode="numeric"></div>
            <label class="check full"><input type="checkbox" id="saveAddress" checked> Save this address to my account</label>
          </div>
        </section>
        <section class="card">
          <h2>Payment</h2>
          <div id="pay-mode"></div>
          <div class="pay-methods" id="pay-methods" role="radiogroup" aria-label="Payment method"></div>
          <p class="notice" style="margin-top:1rem" id="pay-note">Cash on delivery is not available. You will complete payment securely on the provider’s own page. ZAQA never sees or stores your card or wallet PIN.</p>
        </section>
      </div>
      <aside>
        <section class="card" id="summary"><p class="muted">Loading…</p></section>
      </aside>
    </form>
  </main>
  <script type="module" src="/js/pages/checkout.js"></script>
</body>
</html>
